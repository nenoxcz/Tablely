[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tablely"
version = "0.1.0"
description = "Run several training jobs on one machine, sharing GPUs and CPU cores by priority"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
yaml = ["pyyaml>=5.1"]
stream = ["numpy>=1.22"]  # tablely.stream; GPU streaming also needs torch with CUDA
test = ["pytest>=7", "numpy>=1.22"]

[project.scripts]
tablely = "tablely.cli:main"

[tool.setuptools]
packages = ["tablely"]

[tool.pytest.ini_options]
testpaths = ["tests"]
